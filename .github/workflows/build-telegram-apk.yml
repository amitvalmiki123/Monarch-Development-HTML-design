name: Build FairyChat Telegram APK

# Stage 1 of the "FairyChat on the real Telegram source" direction:
# clones the official Telegram-Android source at build time (so we never
# vendor its ~750MB into this repo), applies our FairyChat branding patch
# (telegram-fork/apply-branding.sh), and builds a debug APK on GitHub's free
# runners — the same publish-to-mobile-builds/ pattern the Capacitor APK
# workflow uses.
#
# This APK is the REAL Telegram client rebranded as FairyChat: users log in
# with their Telegram accounts and chat on the Telegram network. It is NOT
# connected to the FairyChat Node backend (that integration is a later
# stage).
#
# Required GitHub secrets (repo -> Settings -> Secrets and variables ->
# Actions), both optional for the build to compile but REQUIRED for login
# to actually work:
#   TG_APP_ID    — numeric api_id from my.telegram.org
#   TG_APP_HASH  — api_hash from my.telegram.org (never commit it to the repo)

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/01a0dc23-monarch-development-html-desig
    paths:
      - 'telegram-fork/**'
      - '.github/workflows/build-telegram-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      # Telegram's native build is disk-hungry; the runner's preinstalled
      # SDK/NDK/toolchains plus a full CMake build can brush against the
      # ~25GB free. Drop some of the biggest unused preinstalled stacks.
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Clone Telegram-Android source (shallow + submodules)
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --jobs 4 \
            https://github.com/DrKLO/Telegram.git telegram-src
          du -sh telegram-src

      - name: Apply FairyChat branding
        env:
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
        run: |
          chmod +x telegram-fork/apply-branding.sh
          ./telegram-fork/apply-branding.sh telegram-src \
            telegram-clone/frontend/android/app/src/main/res

      # Hard gate: NEVER publish an APK built with Telegram's public sample
      # credentials. Login from a sample api_id gets API_ID_PUBLISHED_FLOOD
      # (this happened to the user) and Telegram's API terms forbid shipping
      # published api_ids. Failing here — with instructions — is far better
      # than silently shipping a login-broken build.
      - name: Verify API credentials were applied
        run: |
          STATUS=$(cat telegram-src/.fairychat-creds-status)
          echo "credentials status: $STATUS"
          if [ "$STATUS" != "real" ]; then
            echo "::error::TG_APP_ID / TG_APP_HASH secrets NOT found — the build would fall back to Telegram's public sample api_id=4 (login fails with API_ID_PUBLISHED_FLOOD). Fix: repo Settings -> Secrets and variables -> Actions -> 'Secrets' tab (NOT 'Variables') -> 'New repository secret' -> names exactly TG_APP_ID (your numeric api_id) and TG_APP_HASH (your api_hash) from my.telegram.org. Then re-run this workflow."
            exit 1
          fi
          echo "Real API credentials applied."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK + CMake + accept licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-telegram-${{ hashFiles('telegram-fork/apply-branding.sh') }}
          restore-keys: gradle-telegram-

      - name: Build debug APK
        run: |
          cd telegram-src
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon -x lint 2>&1 | tee gradle-build.log

      - name: Locate APK
        id: apk
        run: |
          APK=$(find telegram-src/TMessagesProj_App/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          ls -la "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairychat-telegram-debug-apk
          path: ${{ steps.apk.outputs.apk }}

      - name: Publish APK into repo (mobile-builds/)
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt 94371840 ]; then
            echo "::warning::APK is over 90MiB — too big to push via git reliably (GitHub blocks >100MiB)."
            echo "Skipping in-repo publish; download the APK from this run's artifact instead."
            exit 0
          fi
          # Drop any failure log left over from a previous failed run.
          git rm --cached --ignore-unmatch telegram-fork/last-build-error.log > /dev/null 2>&1 || true
          rm -f telegram-fork/last-build-error.log
          mkdir -p mobile-builds
          cp "$APK" mobile-builds/fairychat-telegram-debug.apk
          git config user.name "fairychat-ci"
          git config user.email "ci@fairychat.local"
          git add -f mobile-builds/fairychat-telegram-debug.apk
          if git diff --cached --quiet; then
            echo "No APK changes to commit."
          else
            git commit -m "chore: publish FairyChat Telegram-source debug APK [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Catch-all: if ANY step failed (build, publish, anything), commit a
      # diagnostic file into the repo so it can be read via plain git from
      # environments that cannot reach GitHub's Azure log storage.
      - name: Capture failure diagnostics into repo
        if: failure()
        run: |
          git reset --hard HEAD --quiet 2>/dev/null || true
          mkdir -p telegram-fork
          {
            echo "workflow run: ${{ github.run_id }}"
            echo "failed step summary:"
            echo "last 300 lines of gradle output (if the build step ran):"
            tail -n 300 telegram-src/gradle-build.log 2>/dev/null || echo "(no gradle log — failure happened before/after the build step)"
          } > telegram-fork/last-build-error.log
          git config user.name "fairychat-ci"
          git config user.email "ci@fairychat.local"
          git add telegram-fork/last-build-error.log
          git diff --cached --quiet || {
            git commit -m "chore: capture Telegram build failure log [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          }
