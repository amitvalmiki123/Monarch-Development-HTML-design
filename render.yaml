services:
  - type: web
    name: monarch-chat-backend
    runtime: node
    plan: free
    rootDir: telegram-clone/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: JWT_SECRET
        generateValue: true
      - key: GIF_PROVIDER
        value: klipy
      - key: GIF_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # FairyChat Premium (Stage 4): UPI shown for payment + admin panel key.
      # Set the REAL values in Render dashboard (Environment) — never commit.
      - key: UPI_ID
        value: fairychat@upi
      - key: ADMIN_KEY
        sync: false
